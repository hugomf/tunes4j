// Apply the java-library plugin to add support for Java Library



plugins {
	id "application"
	id "java-library"
}

configurations.all {
	exclude group: "commons-logging", module: "commons-logging"
    resolutionStrategy {
        force 'org.jboss.logging:jboss-logging:3.5.3.Final'
        force 'org.slf4j:slf4j-api:1.7.36'
        force 'junit:junit:4.13.2'
        force 'org.springframework:spring-core:5.3.31'
        force 'net.bytebuddy:byte-buddy:1.14.10'
    }
}

application {
	mainClass = "org.ocelot.tunes4j.Tunes4JApp"
}

startScripts {
	defaultJvmOpts = [
		'--add-opens', 'java.base/java.lang=ALL-UNNAMED',
		'--add-opens', 'java.base/java.util=ALL-UNNAMED',
		'--add-opens', 'java.desktop/com.apple.eawt=ALL-UNNAMED'
	]
}

run {
	jvmArgs = [
		'--add-opens', 'java.base/java.lang=ALL-UNNAMED',
		'--add-opens', 'java.base/java.util=ALL-UNNAMED',
		'--add-opens', 'java.desktop/com.apple.eawt=ALL-UNNAMED'
	]
}



version='1.0.0'
// In this section you declare where to find the dependencies of your project
repositories {
    // Use mavenCentral for resolving your dependencies.
    // You can declare any Maven/Ivy/file repository here.
    mavenCentral()

    maven {
        url "https://clojars.org/repo/"
        allowInsecureProtocol = true
    }

    flatDir {
       dirs 'libs'
   }
}

configurations.all {
	exclude group: "commons-logging", module: "commons-logging"
    // Framework versions now managed by Spring Boot BOM
}


dependencies {


	//Java 11 Compatibility (JAF update)

	implementation 'com.sun.activation:javax.activation:1.2.0'

	implementation name: 'liquidlnf'
	implementation name: 'entagged-audioformats-0.10'
	implementation name: 'jaad-0.8.7'
	implementation name: 'VAqua4'


	//implementation group: 'net.incongru.watchservice', name: 'barbary-watchservice', version: '1.0'
	implementation 'com.squareup.okhttp3:okhttp:3.10.0'

	//implementation group: 'org.slf4j', name: 'slf4j-jdk14', version: '1.7.22'
	implementation group: 'org.slf4j', name: 'jcl-over-slf4j', version: '1.7.32'
	implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.2.12'
	
	// Database Connection
	implementation group: 'org.springframework.data', name: 'spring-data-jpa', version: '2.7.18'
	implementation group: 'org.springframework', name: 'spring-context', version: '5.3.31'
	implementation group: 'org.springframework', name: 'spring-orm', version: '5.3.31'
	implementation group: 'org.hibernate', name: 'hibernate-core', version: '5.6.15.Final'
	implementation group: 'org.hibernate', name: 'hibernate-entitymanager', version: '5.6.15.Final'
	implementation group: 'org.hsqldb', name: 'hsqldb', version: '2.7.2'

	//Utilities
	implementation group: 'commons-lang', name: 'commons-lang', version: '2.6'
	implementation group: 'commons-collections', name: 'commons-collections', version: '3.2.2'
	implementation group: 'commons-beanutils', name: 'commons-beanutils', version: '1.9.4'
	implementation (group: 'com.googlecode.soundlibs', name: 'basicplayer', version: '3.0.0.0') {
			exclude group: 'org.slf4j'
			exclude group: 'junit'
	}

	implementation group: 'net.java.dev.glazedlists', name: 'glazedlists_java15', version: '1.8.0'
	   implementation 'com.google.guava:guava:32.1.2-jre'
	implementation 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	implementation (group: 'eu.medsea.mimeutil', name: 'mime-util', version: '2.1.1') {
		exclude group: 'org.slf4j'
	}
	
	 // Mp3 Sound libraries
 	implementation group: 'javazoom', name: 'jlayer', version: '1.0.1'
    implementation (group: 'com.googlecode.soundlibs', name: 'mp3spi', version: '1.9.5.4') {
    		exclude group: 'junit'
    }
	
	// Mp3 tags parsers
	implementation group: 'net.sf.javamusictag', name: 'jid3lib', version: '0.5.4'
	implementation group: 'org.blinkenlights.jid3', name: 'JID3', version: '0.46'
	implementation group: 'org', name: 'jaudiotagger', version: '2.0.3'	
	implementation group: 'com.explodingpixels', name: 'mac_widgets', version: '0.9.5'
	//implementation group: 'org.twitter4j', name: 'twitter4j-core', version: '4.0.6'
	//implementation group: 'org.devzendo', name: 'Quaqua', version: '7.3.4'
	implementation group: 'com.mpatric', name: 'mp3agic', version: '0.9.1'
	//vOrbis Sound Libraries
	implementation (group: 'com.googlecode.soundlibs', name: 'vorbisspi', version: '1.0.3-1')  {
    		exclude group: 'com.googlecode.soundlibs'
    }
	implementation group: 'org.jcraft', name: 'jorbis', version: '0.0.17'
	// implementation group: 'org.clojars.aseipp', name: 'jogg', version: '0.0.7'

	// for FFT transformation
	implementation 'com.github.wendykierp:JTransforms:3.1'

	// TOML parsing for theme configuration
	implementation 'com.moandjiezana.toml:toml4j:0.7.2'
    
    testImplementation 'org.springframework:spring-test:5.3.31'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest-all:1.3'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.assertj:assertj-swing-junit:3.17.1'


}



// Test exclusions for Spring integration tests until framework migration is complete
	test {
    jvmArgs = [
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens', 'java.base/java.io=ALL-UNNAMED',
        '--add-opens', 'java.management/sun.management=ALL-UNNAMED',
        '--add-opens', 'java.desktop/com.apple.eawt=ALL-UNNAMED'
    ]

    // Exclude Spring/Hibernate DAO tests - Spring Framework bytecode compatibility needs update
    exclude '**/dao/ColumnServiceTest.class'
    exclude '**/dao/PlayListServiceTest.class'
    exclude '**/dao/PlayListWithSongsServiceTest.class'
    exclude '**/dao/SongServiceTest.class'
}

compileJava {
    options.compilerArgs.add('-Xlint:all')
    options.compilerArgs.add('-Xlint:-serial,-unchecked,-this-escape,-deprecation')
}



task fatJar(type: Jar) {

	manifest {
        attributes(
    			'Manifest-Version': '1.0',
            'Class-Path': configurations.runtimeClasspath.files.collect {"$it.name"}.join(' '),
 			'Implementation-Title': 'Tunes 4J',
 			'Implementation-Version': version,
            'Main-Class': 'org.ocelot.tunes4j.Tunes4JApp'
        )
    }

    archiveBaseName = project.name + '-all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
    		configurations.runtimeClasspath.collect {
    			it.isDirectory() ? it : zipTree(it)
    		}
    	}
    with jar
}
